<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umbul Limus - Panel Admin Decap CMS</title>
    <link href="config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f4f5f7;
      }
      #cms-error-notice {
        display: none;
        margin: 2rem auto;
        max-width: 600px;
        padding: 1.5rem;
        background: #fff0f0;
        border: 1px solid #ff4d4d;
        border-radius: 8px;
        color: #900;
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="cms-error-notice"></div>

    <script>
      window.addEventListener('error', (e) => {
        const box = document.getElementById('cms-error-notice');
        if (box) {
          box.style.display = 'block';
          box.innerHTML = `<strong>Gagal Memuat Decap CMS:</strong><br>${e.message || e.reason || e}`;
        }
      });
    </script>

    <!-- Script Decap CMS diletakkan di dalam BODY agar DOM body sudah siap sebelum React di-mount -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.3.3/dist/decap-cms.js" onerror="this.onerror=null;this.src='https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js';"></script>
  </body>
</html>
