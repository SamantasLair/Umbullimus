<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umbul Limus - Panel Admin Sveltia CMS</title>
    <!-- Penggunaan URL absolut /admin/config.yml agar tidak meleset ke /config.yml saat diakses via /admin tanpa slash -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f4f5f7;
      }
      .cms-guide-banner {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        z-index: 99998;
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(8px);
        color: #f1f5f9;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 0.5rem 0.85rem;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 440px;
        pointer-events: auto;
      }
      .cms-guide-banner strong { color: #38bdf8; }
    </style>
  </head>
  <body>
    <div class="cms-guide-banner">
      <span>💡 <strong>Panduan Review:</strong> Sebelum menekan <em>Save/Publish</em>, klik tab <strong>"Changes"</strong> di kanan atas untuk mengecek ulang perubahan data.</span>
    </div>

    <script>
      const logDebug = (msg, color) => {
        if (color) {
          console.log(`%c[Sveltia CMS] ${msg}`, `color:${color}; font-weight:bold;`);
        } else {
          console.log(`[Sveltia CMS] ${msg}`);
        }
      };

      // Catat seluruh error uncaught
      window.addEventListener('error', (e) => {
        logDebug(`ERROR: ${e.message || e.reason || e}`, '#f87171');
      });

      // Catat sinyal postMessage yang masuk
      window.addEventListener('message', (e) => {
        logDebug(`postMessage Diterima: ${JSON.stringify(e.data)}`, '#4ade80');
      });

      // Interseptor window.open untuk memastikan popup OAuth tidak pernah meleset ke api.netlify.com
      const originalOpen = window.open;
      window.open = function(url, ...rest) {
        if (typeof url === 'string' && url.includes('api.netlify.com/api/auth')) {
          const dynamicUrl = url.replace('https://api.netlify.com', window.location.origin);
          logDebug(`[AUTH] Mengarahkan popup OAuth Netlify ke origin aktif: ${dynamicUrl}`, '#38bdf8');
          return originalOpen.call(this, dynamicUrl, ...rest);
        }
        return originalOpen.call(this, url, ...rest);
      };

      // Interseptor jaringan Fetch API untuk injeksi origin dinamis & log API
      const originalFetch = window.fetch;
      window.fetch = async function(...args) {
        const url = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
        try {
          const res = await originalFetch.apply(this, args);
          if (url.includes('config.yml')) {
            const text = await res.text();
            const origin = window.location.origin;
            const patched = text.includes('base_url:')
              ? text.replace(/base_url:\s*[^\r\n]+/g, `base_url: ${origin}`)
              : text.replace(/backend:\s*[\r\n]+/, `backend:\n  base_url: ${origin}\n`);
            logDebug(`[CONFIG] Base URL dinamis aktif: ${origin}`, '#38bdf8');
            return new Response(patched, {
              status: res.status,
              statusText: res.statusText,
              headers: res.headers,
            });
          }
          if (url.includes('github.com') || url.includes('api/')) {
            if (!res.ok) {
              const clone = res.clone();
              const text = await clone.text();
              logDebug(`API FAIL [${res.status}] ${url}: ${text.slice(0, 100)}`, '#f87171');
            } else {
              logDebug(`API OK [${res.status}] ${url}`, '#4ade80');
            }
          }
          return res;
        } catch(err) {
          if (url.includes('github.com') || url.includes('api/')) {
            logDebug(`API ERROR ${url}: ${err.message}`, '#f87171');
          }
          throw err;
        }
      };
    </script>

    <!-- Script Sveltia CMS (Modern drop-in replacement untuk Decap CMS) -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
