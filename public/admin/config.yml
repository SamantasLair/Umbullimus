backend:
  name: github
  repo: SamantasLair/Umbullimus
  branch: main
  base_url: https://www.umbullimus.my.id
  auth_endpoint: api/auth

# Lokasi penyimpanan gambar yang diunggah via CMS
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ====================================================================
  # 🏠 HALAMAN 1: BERANDA
  # ====================================================================
  - name: "beranda"
    label: "🏠 1. Halaman Beranda"
    files:
      - label: "Hero Banner & Sambutan Utama"
        name: "hero"
        file: "public/data/beranda/hero.json"
        format: "json"
        fields:
          - {label: "📝 [Teks] Teks Badge Wilayah", name: "badge_teks", widget: "string", hint: "Teks kecil di atas judul utama, contoh: Pesawaran · Lampung"}
          - {label: "📝 [Teks] Judul Baris 1 (Tebal)", name: "judul_baris_1", widget: "string", hint: "Kata pertama nama desa, contoh: Umbul"}
          - {label: "📝 [Teks] Judul Baris 2 (Aksen)", name: "judul_baris_2", widget: "string", hint: "Kata kedua nama desa, contoh: Limus"}
          - {label: "📝 [Teks] Kalimat Tagline Hero", name: "tagline", widget: "text", hint: "Deskripsi pengantar yang tampil di bawah judul hero"}
          - {label: "🖼️ [Media] Gambar Poster Latar Video", name: "video_poster", widget: "image", hint: "Gambar awal sebelum video berputar (pilih foto lanskap horizontal)"}
          - {label: "🔘 [Tombol] Teks Tombol Utama", name: "tombol_utama_teks", widget: "string", hint: "Contoh: Jelajahi Wisata"}
          - {label: "🔘 [Tombol] Teks Tombol Kedua", name: "tombol_kedua_teks", widget: "string", hint: "Contoh: Lihat Galeri"}

  # ====================================================================
  # 🏛️ HALAMAN 2: PROFIL & VISI MISI DESA
  # ====================================================================
  - name: "profil_desa"
    label: "🏛️ 2. Profil & Visi Misi"
    files:
      - label: "Profil Umum & Sejarah Desa"
        name: "profil"
        file: "public/data/profil/data.json"
        format: "json"
        fields:
          - {label: "📝 [Teks] Nama Resmi Desa", name: "nama", widget: "string", hint: "Contoh: Umbul Limus"}
          - {label: "📝 [Teks] Tagline / Slogan Desa", name: "tagline", widget: "string", hint: "Contoh: Surga Tersembunyi di Jantung Lampung"}
          - {label: "📝 [Teks] Cerita Sejarah Lengkap Desa", name: "sejarah", widget: "text", hint: "Tuliskan sejarah dan asal-usul pembentukan desa"}
          - {label: "📝 [Teks] Kecamatan", name: "kecamatan", widget: "string"}
          - {label: "📝 [Teks] Kabupaten", name: "kabupaten", widget: "string"}
          - {label: "📝 [Teks] Provinsi", name: "provinsi", widget: "string"}
          - {label: "🔢 [Angka] Luas Wilayah", name: "luas_wilayah", widget: "string", hint: "Contoh: 2.158 HA"}
          - {label: "🔢 [Angka] Jumlah Penduduk (Jiwa)", name: "jumlah_penduduk", widget: "string", hint: "Contoh: 728"}
          - {label: "🔢 [Angka] Jumlah RT", name: "jumlah_rt", widget: "number", hint: "Jumlah RT, contoh: 7"}
          - {label: "🔢 [Angka] Jumlah RW", name: "jumlah_rw", widget: "number", hint: "Jumlah RW, contoh: 3"}
          - {label: "🔢 [Angka] Jumlah Dusun", name: "jumlah_dusun", widget: "number", hint: "Jumlah Dusun di desa, contoh: 3"}

      - label: "Visi & Misi Pembangunan Desa"
        name: "visi_misi"
        file: "public/data/visi-misi/data.json"
        format: "json"
        fields:
          - {label: "📝 [Teks] Rumusan Visi Desa", name: "visi", widget: "text", hint: "Rumusan cita-cita masa depan Desa Umbul Limus"}
          - label: "📝 [Daftar] Butir-Butir Misi Pembangunan"
            name: "misi"
            widget: "list"
            field: {name: "misi_item", label: "Butir Misi", widget: "string", hint: "Tuliskan 1 butir langkah nyata pembangunan desa"}

  # ====================================================================
  # 👥 HALAMAN 3: STRUKTUR ORGANISASI & TOKOH ADAT
  # ====================================================================
  - name: "bagan_desa"
    label: "👥 3. Struktur Desa & Bagan"
    files:
      - label: "Bagan Aparatur Desa & Tokoh Adat"
        name: "struktur_desa"
        file: "public/data/bagan/struktur.json"
        format: "json"
        fields:
          - {label: "📝 [Teks] Nama Desa", name: "desa", widget: "string"}
          - {label: "📝 [Teks] Kecamatan", name: "kecamatan", widget: "string"}
          - {label: "📝 [Teks] Kabupaten", name: "kabupaten", widget: "string"}
          - {label: "📝 [Teks] Provinsi", name: "provinsi", widget: "string"}
          - {label: "🖼️ [Media] Foto Latar Header Bagan", name: "background", widget: "image", required: false, hint: "Foto pemandangan atau balai desa sebagai latar atas bagan"}
          - label: "👥 [Daftar] Aparatur Pemerintahan Desa (CRUD)"
            name: "struktur"
            widget: "list"
            summary: "Tier {{tier}} - {{jabatan}}: {{nama}}"
            fields:
              - {label: "🔢 [Angka] ID Posisi", name: "id", widget: "number", hint: "Nomor penanda urutan hierarki (1 untuk Kades)"}
              - {label: "🔢 [Angka] Tingkat Baris Visual (Tier)", name: "tier", widget: "number", hint: "Baris ke berapa kartu ini tampil di bagan (1: Kades, 2: Sekdes, 3: Kaur/Kasi, dst)"}
              - {label: "🔢 [Angka] ID Atasan Langsung (Parent)", name: "parent", widget: "number", hint: "ID pejabat yang menjadi atasan garis komando (0 untuk Kades yang tidak punya atasan)"}
              - {label: "📝 [Teks] Jabatan / Posisi", name: "jabatan", widget: "string", hint: "Contoh: Kepala Desa, Sekretaris Desa, Kadus I"}
              - {label: "📝 [Teks] Nama Lengkap Pejabat", name: "nama", widget: "string", required: false, hint: "Nama pejabat beserta gelar jika ada"}
              - {label: "⚙️ [Pengaturan] Kelompok Posisi", name: "kelompok", widget: "string", required: false, hint: "Pilihan: kaurkasi, bpd, kadus, rt, atau kpm"}
              - {label: "📝 [Teks] Periode Jabatan", name: "periode", widget: "string", required: false, hint: "Contoh: 2021 - 2027"}
              - {label: "📝 [Teks] Wilayah RW / Dusun", name: "dusun", widget: "string", required: false}
              - {label: "📝 [Teks] Keterangan / Bio Singkat", name: "bio", widget: "text", required: false}
              - {label: "🖼️ [Media] Foto Profil Pejabat", name: "foto", widget: "image", required: false, hint: "Unggah pas foto formal atau setengah badan"}
              - label: "👥 Kaur (khusus kelompok Kaur/Kasi)"
                name: "kaur"
                widget: "list"
                required: false
                summary: "{{jabatan}}: {{nama}}"
                fields:
                  - {label: "Jabatan", name: "jabatan", widget: "string"}
                  - {label: "Nama", name: "nama", widget: "string"}
                  - {label: "Foto", name: "foto", widget: "image", required: false}
              - label: "👥 Kasi (khusus kelompok Kaur/Kasi)"
                name: "kasi"
                widget: "list"
                required: false
                summary: "{{jabatan}}: {{nama}}"
                fields:
                  - {label: "Jabatan", name: "jabatan", widget: "string"}
                  - {label: "Nama", name: "nama", widget: "string"}
                  - {label: "Foto", name: "foto", widget: "image", required: false}
              - label: "👥 Anggota (khusus kelompok BPD & KPM)"
                name: "anggota"
                widget: "list"
                required: false
                summary: "{{jabatan}}: {{nama}}"
                fields:
                  - {label: "Jabatan", name: "jabatan", widget: "string", required: false}
                  - {label: "Nama", name: "nama", widget: "string"}
                  - {label: "Foto", name: "foto", widget: "image", required: false}

          - label: "👑 [Daftar] Tokoh Adat (Penyimbang / Saibatin)"
            name: "tokoh_adat"
            widget: "list"
            summary: "Rank {{rank}} - {{nama}} ({{gelar}})"
            fields:
              - {label: "🔢 [Angka] Urutan Ranking", name: "rank", widget: "number", hint: "1, 2, 3..."}
              - {label: "📝 [Teks] Nama Tokoh Adat", name: "nama", widget: "string"}
              - {label: "📝 [Teks] Gelar Adat", name: "gelar", widget: "string", hint: "Contoh: Sutan, Raden, Pangiran"}
              - {label: "📝 [Teks] Peran / Sebutan Adat", name: "peran", widget: "string", hint: "Contoh: Saibatin Marga, Tokoh Adat Kampung"}
              - {label: "🖼️ [Media] Foto Profil Tokoh", name: "foto", widget: "image", required: false}

  # ====================================================================
  # 🏞️ HALAMAN 4: DESTINASI WISATA
  # ====================================================================
  - name: "wisata_desa"
    label: "🏞️ 4. Destinasi Wisata"
    files:
      - label: "Katalog Tempat Wisata Desa"
        name: "tempat_wisata"
        file: "public/data/tempat-wisata/list.json"
        format: "json"
        fields:
          - label: "🏞️ [Daftar] Kartu Tempat Wisata (CRUD)"
            name: "items"
            widget: "list"
            summary: "{{nama}} ({{kategori}})"
            fields:
              - {label: "📝 [Teks] ID Unik", name: "id", widget: "string", hint: "Nama tempat tanpa spasi/huruf kecil saja, misal: way-curup atau warisan-budaya"}
              - {label: "📝 [Teks] Nama Destinasi Wisata", name: "nama", widget: "string", hint: "Contoh: Air Terjun Way Curup"}
              - {label: "🏷️ [Kategori] Jenis Wisata", name: "kategori", widget: "select", options: ["Wisata Alam", "Wisata Budaya", "Wisata Religi", "Wisata Edukasi", "Ekowisata"], hint: "Pilih kategori wisata"}
              - {label: "📝 [Teks] Deskripsi & Keistimewaan", name: "deskripsi", widget: "text", hint: "Ceritakan keindahan dan fasilitas tempat wisata ini"}
              - {label: "🖼️ [Media] Foto Utama Wisata", name: "gambar", widget: "image", hint: "Pilih foto lanskap terbaik beresolusi tajam"}
              - label: "🏷️ [Daftar] Fasilitas di Lokasi"
                name: "fasilitas"
                widget: "list"
                field: {name: "fasilitas_item", label: "Fasilitas", widget: "string", hint: "Contoh: Area Parkir, Kamar Mandi, Gazebo, Warung Warga"}

  # ====================================================================
  # 📊 HALAMAN 5: INFOGRAFIS & STATISTIK DESA
  # ====================================================================
  - name: "infografis_desa"
    label: "📊 5. Infografis Data Desa"
    files:
      - label: "Statistik, Batas Kompas & Ekonomi"
        name: "infografis"
        file: "public/data/infografis/data.json"
        format: "json"
        fields:
          - {label: "🔢 [Angka] Tahun Pembaruan Data", name: "tahun_data", widget: "number", hint: "Tahun pencatatan data, contoh: 2026"}
          - {label: "📍 [Peta] Link Embed Google Maps", name: "maps_embed", widget: "string", required: false, hint: "Tautan embed peta desa"}
          - {label: "📍 [Peta] Label Lokasi Peta", name: "maps_label", widget: "string", required: false, hint: "Contoh: Desa Umbul Limus, Marga Punduh, Pesawaran"}
          - label: "🔢 [Kependudukan] Statistik Penduduk"
            name: "kependudukan"
            widget: "object"
            fields:
              - {label: "Total Jiwa", name: "total", widget: "number", hint: "Contoh: 728"}
              - {label: "Satuan", name: "satuan", widget: "string", hint: "Contoh: Jiwa"}
              - {label: "Keterangan Sumber Data", name: "keterangan", widget: "string", required: false}
              - label: "Rincian Komposisi"
                name: "rincian"
                widget: "list"
                summary: "{{label}}: {{value}}"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "Jumlah / Persentase", name: "value", widget: "string"}
          - label: "🧭 [Wilayah] Batas Wilayah & Kompas Mata Angin"
            name: "wilayah"
            widget: "list"
            summary: "{{label}}: {{value}}"
            fields:
              - {label: "Nama Label / Arah", name: "label", widget: "string", hint: "Contoh: Batas Utara, Batas Selatan, Luas Permukiman"}
              - {label: "Isi Keterangan", name: "value", widget: "string", hint: "Contoh: Desa Tajur, Desa Banding Agung"}
              - {label: "Ikon Emoji", name: "icon", widget: "string", required: false, hint: "Contoh: 🧭, 🌲, ⛰️"}
          - label: "🎓 [Pendidikan] Tingkat Pendidikan Warga"
            name: "pendidikan"
            widget: "list"
            summary: "{{label}}: {{value}}"
            fields:
              - {label: "Jenjang Pendidikan", name: "label", widget: "string"}
              - {label: "Jumlah Warga", name: "value", widget: "number"}
          - label: "💼 [Pekerjaan] Mata Pencaharian Warga"
            name: "pekerjaan"
            widget: "list"
            summary: "{{label}}: {{value}}"
            fields:
              - {label: "Sektor Profesi", name: "label", widget: "string"}
              - {label: "Jumlah Warga / Persentase", name: "value", widget: "string"}
              - {label: "Ikon Emoji", name: "icon", widget: "string", required: false}

  # ====================================================================
  # 📸 HALAMAN 6: GALERI FOTO DOKUMENTASI
  # ====================================================================
  - name: "galeri_desa"
    label: "📸 6. Galeri Dokumentasi Foto"
    files:
      - label: "Album Foto Dokumentasi & KKN"
        name: "galeri"
        file: "public/images/galeri/manifest.json"
        format: "json"
        fields:
          - label: "📸 [Daftar] Foto Dokumentasi (CRUD)"
            name: "images"
            widget: "list"
            summary: "{{alt}} ({{src}})"
            fields:
              - {label: "🖼️ [Media] Berkas Foto", name: "src", widget: "image", hint: "Pilih foto dokumentasi yang ingin diunggah"}
              - {label: "📝 [Teks] Judul / Keterangan Foto", name: "alt", widget: "string", hint: "Keterangan foto, contoh: Gotong royong renovasi balai desa"}
              - {label: "🏷️ [Kategori] Kategori Foto", name: "kategori", widget: "string", required: false, hint: "Contoh: Budaya, Wisata, Kegiatan, Alam"}

  # ====================================================================
  # 📞 HALAMAN 7: KONTAK BALAI DESA & FOOTER
  # ====================================================================
  - name: "kontak_footer"
    label: "📞 7. Kontak & Footer Web"
    files:
      - label: "Kontak Balai Desa & Media Sosial"
        name: "kontak"
        file: "public/data/kontak/data.json"
        format: "json"
        fields:
          - {label: "📍 [Lokasi] Alamat Lengkap Kantor Balai Desa", name: "alamat_kantor", widget: "text", hint: "Tuliskan alamat kantor balai desa selengkapnya"}
          - {label: "💬 [Kontak] Nomor WhatsApp Resmi", name: "whatsapp_nomor", widget: "string", hint: "Format: +62 813-8666-6693"}
          - {label: "🔗 [Tautan] Link Chat WhatsApp", name: "whatsapp_link", widget: "string", hint: "Format: https://wa.me/6281386666693"}
          - {label: "👤 [Teks] Nama & Jabatan Narahubung", name: "narahubung_nama", widget: "string", hint: "Contoh: Rudi Saputra, S.I.P. — Bendahara Desa"}
          - {label: "🗺️ [Peta] Tautan Titik Google Maps", name: "google_maps_link", widget: "string", hint: "Link Google Maps koordinat presisi balai desa"}
          - {label: "📷 [Media Sosial] Akun Instagram Desa", name: "instagram_link", widget: "string", required: false, hint: "Link profil instagram desa jika ada"}
          - {label: "📝 [Teks] Slogan Penutup Footer", name: "footer_tagline", widget: "text", hint: "Slogan yang tampil di sebelah kiri footer bawah"}
          - {label: "📝 [Teks] Teks Hak Cipta", name: "hak_cipta_teks", widget: "string", hint: "Contoh: Desa Wisata Budaya Umbul Limus. Seluruh hak cipta dilindungi."}
          - {label: "📝 [Teks] Kredit Pembuat Website", name: "credit_teks", widget: "string", hint: "Contoh: Dibuat oleh Tim KKN"}
