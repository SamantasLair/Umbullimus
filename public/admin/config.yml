backend:
  name: github
  repo: SamantasLair/Umbullimus
  branch: main
  auth_endpoint: api/auth

# Lokasi penyimpanan gambar yang di-upload via CMS
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "data"
    label: "Manajemen Data Web"
    files:
      - label: "Profil Desa"
        name: "profil"
        file: "public/data/profil/data.json"
        format: "json"
        fields:
          - {label: "Nama Desa", name: "nama", widget: "string"}
          - {label: "Kecamatan", name: "kecamatan", widget: "string"}
          - {label: "Kabupaten", name: "kabupaten", widget: "string"}
          - {label: "Provinsi", name: "provinsi", widget: "string"}
          - {label: "Luas Wilayah", name: "luas_wilayah", widget: "string"}
          - {label: "Jumlah Penduduk", name: "jumlah_penduduk", widget: "string"}
          - {label: "Jumlah RT", name: "jumlah_rt", widget: "number"}
          - {label: "Jumlah RW", name: "jumlah_rw", widget: "number"}
          - {label: "Jumlah Dusun", name: "jumlah_dusun", widget: "number"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Sejarah Desa", name: "sejarah", widget: "text"}

      - label: "Visi & Misi Desa"
        name: "visi_misi"
        file: "public/data/visi-misi/data.json"
        format: "json"
        fields:
          - {label: "Visi Desa", name: "visi", widget: "text"}
          - label: "Daftar Misi Desa"
            name: "misi"
            widget: "list"
            field: {label: "Butir Misi", name: "misi_item", widget: "string"}

      - label: "Struktur Organisasi Desa"
        name: "bagan"
        file: "public/data/bagan/struktur.json"
        format: "json"
        fields:
          - {label: "Nama Desa", name: "desa", widget: "string"}
          - {label: "Kecamatan", name: "kecamatan", widget: "string"}
          - {label: "Kabupaten", name: "kabupaten", widget: "string"}
          - {label: "Provinsi", name: "provinsi", widget: "string"}
          - {label: "Foto Latar Header", name: "background", widget: "image", required: false}
          - label: "Struktur Organisasi (Aparat, BPD, Kadus, RT, KPM)"
            name: "struktur"
            widget: "list"
            summary: "Tier {{tier}} - {{jabatan}}: {{nama}}"
            fields:
              - {label: "ID Node", name: "id", widget: "number"}
              - {label: "Tier (Baris Visual)", name: "tier", widget: "number"}
              - {label: "ID Parent (Atasan Garis Komando)", name: "parent", widget: "number"}
              - {label: "Jabatan / Label Posisi", name: "jabatan", widget: "string"}
              - {label: "Nama Pejabat", name: "nama", widget: "string", required: false}
              - {label: "Kelompok (kaurkasi/bpd/kadus/rt/kpm)", name: "kelompok", widget: "string", required: false}
              - {label: "Periode Jabatan", name: "periode", widget: "string", required: false}
              - {label: "RW", name: "rw", widget: "string", required: false}
              - {label: "Dusun", name: "dusun", widget: "string", required: false}
              - {label: "Keterangan", name: "keterangan", widget: "string", required: false}
              - {label: "Bio Singkat", name: "bio", widget: "text", required: false}
              - {label: "Foto Profil", name: "foto", widget: "image", required: false}
              - label: "Ketua BPD (khusus kelompok BPD)"
                name: "ketua"
                widget: "object"
                required: false
                fields:
                  - {label: "Jabatan", name: "jabatan", widget: "string"}
                  - {label: "Nama", name: "nama", widget: "string"}
                  - {label: "Foto", name: "foto", widget: "image", required: false}
              - label: "Kaur (khusus kelompok Kaur/Kasi)"
                name: "kaur"
                widget: "list"
                required: false
                summary: "{{jabatan}}: {{nama}}"
                fields:
                  - {label: "Jabatan", name: "jabatan", widget: "string"}
                  - {label: "Nama", name: "nama", widget: "string"}
                  - {label: "Foto", name: "foto", widget: "image", required: false}
              - label: "Kasi (khusus kelompok Kaur/Kasi)"
                name: "kasi"
                widget: "list"
                required: false
                summary: "{{jabatan}}: {{nama}}"
                fields:
                  - {label: "Jabatan", name: "jabatan", widget: "string"}
                  - {label: "Nama", name: "nama", widget: "string"}
                  - {label: "Foto", name: "foto", widget: "image", required: false}
              - label: "Daftar Anggota (khusus kelompok BPD & KPM)"
                name: "anggota"
                widget: "list"
                required: false
                summary: "{{jabatan}}: {{nama}}"
                fields:
                  - {label: "Jabatan", name: "jabatan", widget: "string", required: false}
                  - {label: "Nama", name: "nama", widget: "string"}
                  - {label: "Foto", name: "foto", widget: "image", required: false}
          - label: "Tokoh Adat (Penyimbang / Saibatin)"
            name: "tokoh_adat"
            widget: "list"
            summary: "Rank {{rank}} - {{nama}} ({{gelar}})"
            fields:
              - {label: "Urutan / Rank", name: "rank", widget: "number"}
              - {label: "Nama Tokoh", name: "nama", widget: "string"}
              - {label: "Gelar Adat", name: "gelar", widget: "string"}
              - {label: "Peran Adat", name: "peran", widget: "string"}
              - {label: "Foto Profil", name: "foto", widget: "image", required: false}

      - label: "Tempat Wisata"
        name: "tempat_wisata"
        file: "public/data/tempat-wisata/list.json"
        format: "json"
        fields:
          - label: "Daftar Tempat Wisata"
            name: "items"
            widget: "list"
            summary: "{{nama}}"
            fields:
              - {label: "ID (unik, tanpa spasi)", name: "id", widget: "string"}
              - {label: "Nama Tempat", name: "nama", widget: "string"}
              - {label: "Kategori", name: "kategori", widget: "string"}
              - {label: "Deskripsi", name: "deskripsi", widget: "text"}
              - {label: "Gambar", name: "gambar", widget: "image"}
              - label: "Fasilitas"
                name: "fasilitas"
                widget: "list"
                field: {label: "Fasilitas", name: "fasilitas_item", widget: "string"}

      - label: "Infografis Data Desa"
        name: "infografis"
        file: "public/data/infografis/data.json"
        format: "json"
        fields:
          - {label: "Nama Desa", name: "desa", widget: "string"}
          - {label: "Kecamatan", name: "kecamatan", widget: "string"}
          - {label: "Kabupaten", name: "kabupaten", widget: "string"}
          - {label: "Provinsi", name: "provinsi", widget: "string"}
          - label: "Asal Usul Nama"
            name: "asal_usul"
            widget: "object"
            fields:
              - {label: "Judul Section", name: "judul", widget: "string"}
              - label: "Kata 'Umbul'"
                name: "umbul"
                widget: "object"
                fields:
                  - {label: "Kata", name: "kata", widget: "string"}
                  - {label: "Penjelasan", name: "penjelasan", widget: "text"}
              - label: "Kata 'Limus'"
                name: "limus"
                widget: "object"
                fields:
                  - {label: "Kata", name: "kata", widget: "string"}
                  - {label: "Penjelasan", name: "penjelasan", widget: "text"}
          - label: "Statistik Utama (baris angka)"
            name: "stats"
            widget: "list"
            summary: "{{value}} {{label}}"
            fields:
              - {label: "Nilai", name: "value", widget: "number"}
              - {label: "Label", name: "label", widget: "string"}
          - label: "Wilayah"
            name: "wilayah"
            widget: "object"
            fields:
              - {label: "Luas Wilayah", name: "luas", widget: "string"}
              - {label: "Catatan Luas (mis. perlu konfirmasi satuan)", name: "luas_catatan", widget: "string", required: false}
              - label: "Batas Wilayah"
                name: "batas"
                widget: "object"
                fields:
                  - {label: "Utara", name: "utara", widget: "string"}
                  - {label: "Selatan", name: "selatan", widget: "string"}
                  - {label: "Timur", name: "timur", widget: "string"}
                  - {label: "Barat", name: "barat", widget: "string"}
              - {label: "Deskripsi Wilayah", name: "deskripsi", widget: "text"}
              - {label: "Link Embed Google Maps", name: "maps_embed", widget: "string", required: false, hint: "Google Maps > Bagikan > Sematkan peta > salin URL di dalam src=\"...\""}
          - label: "Jarak ke Pusat Pemerintahan"
            name: "jarak"
            widget: "list"
            summary: "{{label}}: {{km}} km"
            fields:
              - {label: "Label Tujuan", name: "label", widget: "string"}
              - {label: "Estimasi Waktu Tempuh", name: "waktu", widget: "string"}
              - {label: "Jarak (km)", name: "km", widget: "number"}
          - label: "Penduduk & Ekonomi"
            name: "penduduk_ekonomi"
            widget: "object"
            fields:
              - {label: "Judul Section", name: "judul", widget: "string"}
              - label: "Komposisi Penduduk"
                name: "komposisi"
                widget: "object"
                fields:
                  - {label: "Persentase Laki-laki", name: "laki_persen", widget: "number"}
                  - {label: "Persentase Perempuan", name: "perempuan_persen", widget: "number"}
                  - {label: "Rata-rata Jiwa per KK", name: "rata_jiwa_per_kk", widget: "number"}
              - label: "Mata Pencaharian"
                name: "pekerjaan"
                widget: "object"
                fields:
                  - {label: "Persentase Petani", name: "petani_persen", widget: "number"}
                  - {label: "Persentase Lainnya", name: "lainnya_persen", widget: "number"}
                  - {label: "Label Pekerjaan Lainnya", name: "lainnya_label", widget: "string"}
                  - {label: "Deskripsi Hasil Pertanian", name: "hasil", widget: "text"}
          - label: "Arsitektur"
            name: "arsitektur"
            widget: "object"
            fields:
              - {label: "Judul", name: "judul", widget: "string"}
              - {label: "Deskripsi", name: "deskripsi", widget: "text"}
          - label: "Pariwisata"
            name: "pariwisata"
            widget: "object"
            fields:
              - {label: "Judul", name: "judul", widget: "string"}
              - {label: "Deskripsi", name: "deskripsi", widget: "text"}
          - label: "Infrastruktur & Fasilitas"
            name: "infrastruktur"
            widget: "object"
            fields:
              - label: "Infrastruktur Dasar"
                name: "dasar"
                widget: "list"
                summary: "{{label}}"
                fields:
                  - {label: "Keterangan", name: "label", widget: "string"}
                  - {label: "Sudah Ada?", name: "ada", widget: "boolean", default: true}
              - label: "Kesehatan, Pendidikan & Ibadah"
                name: "sosial"
                widget: "list"
                summary: "{{label}}"
                fields:
                  - {label: "Keterangan", name: "label", widget: "string"}
                  - {label: "Sudah Ada?", name: "ada", widget: "boolean", default: true}
          - {label: "Sosial & Budaya", name: "sosial_budaya", widget: "text"}
          - {label: "Pemerintahan", name: "pemerintahan", widget: "text"}

      - label: "Galeri Foto"
        name: "galeri"
        file: "public/images/galeri/manifest.json"
        format: "json"
        fields:
          - label: "Daftar Foto"
            name: "images"
            widget: "list"
            summary: "{{alt}}"
            fields:
              - {label: "Gambar", name: "src", widget: "image"}
              - {label: "Judul / Keterangan", name: "alt", widget: "string"}
              - {label: "Kategori (untuk filter)", name: "kategori", widget: "string", required: false}
